# Postgres для ОТКРЫТОГО контура (локальная синтетика).
# В закрытом контуре не используется — там подключение к пром-БД по SQLAlchemy URL.
services:
  uzp_pg:
    image: postgres:16
    container_name: uzp_pg
    environment:
      POSTGRES_USER: uzp
      POSTGRES_PASSWORD: uzp
      POSTGRES_DB: uzp
    ports:
      - "55433:5432"   # 55432 занят другим контейнером (dp_pg)
    volumes:
      - uzp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzp -d uzp"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  uzp_pg_data:
