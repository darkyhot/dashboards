schema: spec-driven

# Один конфиг на все витрины: marts/<витрина>/openspec/config.yaml — симлинк на этот файл.
# Пути ниже — от папки openspec/ (корень SDD-проекта).

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  SHALL / MUST — стандарт OpenSpec, значит «должен»; без них не проходит openspec validate --strict.

  Предмет: витрины УЗП в Greenplum (ядро PostgreSQL 9.4). Реализация — только plpgsql-функции
  (запускаются потоками информатики) и DDL; Python и внешние скрипты не используются.
  SQL MUST быть совместим с Greenplum на ядре PostgreSQL 9.4.

  Каждая витрина — отдельный OpenSpec в marts/<витрина>/openspec/ (свои specs и архив).
  Требования заказчика — marts/<витрина>/intents/NNN-<кратко>.md, текст заказчика в них не правится.
  В «Уточнениях» интента у каждого пункта: причина (что в тексте неоднозначно), вопрос, ответ.

  Код-стайл обязателен, он лежит в knowledge/codestyle/:
  - conventions.md — схемы (прод / лаборатория), общие требования, куда смотреть;
  - naming.md — имена объектов и полей, глоссарий готовых имён УЗП, описания (comment on);
  - sql-style.md — оформление любого SQL, даты и функции-помощники, предикат по report_dt;
  - target-tables.md — целевые и tmp-таблицы, порядок обновления, параметры функций,
    статусы, лог, проверки ККД, обработка ошибок;
  - templates/mart_ddl.sql — шаблон DDL витрины; templates/etl_function.sql — шаблон функции.
  При конфликте этого файла с код-стайлом прав код-стайл.

  Профили таблиц-источников (поля, типы, описания) — ../data/profiles/<схема>.<таблица>.profile.json.

  Стиль текста всех артефактов — ASD-STE100, адаптированный к русскому:
  - Одно предложение — одна мысль. Одна задача — одно действие.
  - Длина предложения: инструкция — до 20 слов, описание — до 25.
  - Абзац — до 6 предложений. Перечисление из 3+ пунктов — списком.
  - Задачи и шаги — в форме команды: «Создать…», «Проверить…».
  - Действительный залог: «функция пишет строку», не «строка записывается функцией».
  - Глагол вместо отглагольного существительного: «проверить ключ», не «выполнение проверки ключа».
  - Один термин — одно значение, без синонимов. Пара ИНН + ГОСБ — всегда «пара».
  - Без вводных слов, оценок, повторов и объяснений, не нужных для решения.
  - Не повторять другой артефакт — ссылаться на него.
  - Одинаковые атрибуты у нескольких объектов — таблицей.
  - Числа — цифрами, условия — формулой (`np_cnt > emp_potential_qty`).

rules:
  proposal:
    - Первая строка — ссылка на файл интента (marts/<витрина>/intents/NNN-*.md), из которого изменение.
    - Why — пересказ интента своими словами без добавлений; чего в интенте нет — вынести в открытые вопросы, не додумывать.
    - Перечислить таблицы-источники (схема.таблица) и что вне рамок изменения.
  specs:
    - Для витрины описать зерно (одна строка = ...), ключ уникальности, отчётную дату или период.
    - Каждое поле — по naming.md; если имя есть в глоссарии УЗП, брать его.
    - Каждый показатель — отдельный Requirement с формулой, единицей и правилом для пустых значений; формула только из интента или ответа пользователя.
    - Каждый Requirement — минимум один Scenario с проверяемым условием (WHEN данные ... THEN витрина ...).
    - Обязательные сценарии — уникальность ключа, сверка итога с источником, отсутствие дублей после JOIN, повторный запуск за ту же дату не даёт дублей, поведение при отсутствии данных источника (статус 98) и при непройденной проверке ККД (статус 97).
  design:
    - Имя функции — <витрина>_<глагол> (target-tables.md); управляющая функция принимает ровно p_etl_load_id int8, p_start_dttm timestamp, p_end_dttm timestamp; описать, как из них получается отчётная дата или период.
    - Описать шаги функции с номерами шагов лога (01, 02 ККД, 10 tmp, 20 стейджинг, 30 целевая, 40 статистика) и временные таблицы tmp_ / tmp_stg_.
    - Описать DDL витрины по templates/mart_ddl.sql — ключ дистрибуции, партиционирование, сжатие; и способ обновления (truncate при замене от 20% записей, иначе delete по отчётной дате).
    - Расчёт сначала в лабораторной схеме s_grnplm_ld_salesntwrk_pcap_sn_t_uzp, вывод в прод — отдельным решением.
  tasks:
    - Одна задача — один проверяемый кусок — DDL витрины, один шаг функции (01/02/10/20/30/40) или одна проверка из specs; каждая заканчивается проверочным SQL-запросом.
    - Проверки сценариев из specs оформляются SQL-запросами, которые возвращают пустой результат, если всё верно.
    - Отдельные задачи на DDL с comment on table / column и на comment on function.
    - Если меняется существующая таблица или функция — задача на скрипт в sql/migrations/ (для таблицы) и на строку в «Изменения» шапки функции.

operations:
  apply:
    guidance:
      - Перед написанием SQL прочитать knowledge/codestyle/sql-style.md, naming.md и target-tables.md.
      - Новую функцию и DDL начинать с копии шаблона из knowledge/codestyle/templates/.
      - SQL витрины — в marts/<витрина>/sql/ — ddl/<таблица>.sql, functions/<функция>.sql (один объект — один файл, всегда актуальная версия), migrations/NNN-<кратко>.sql для изменения уже выведенной таблицы.
      - При изменении функции дописать строку в раздел «Изменения» её шапки с номером интента.
